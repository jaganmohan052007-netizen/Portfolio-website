<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-File Full-Stack Portfolio</title>
    <style>
        /* ==========================================================================
           FRONTEND STYLES (CSS)
           ========================================================================== */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-purple: #a855f7;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; padding: 2rem 1rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 4rem; }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        header h1 span { background: linear-gradient(to right, var(--accent), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-secondary); }

        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media (min-width: 768px) { .dashboard-grid { grid-template-columns: 1fr 2fr; } }

        /* Form / "Backend" Input Section */
        .form-panel { background-color: var(--bg-secondary); border: 1px solid var(--border); padding: 2rem; border-radius: 0.75rem; height: fit-content; }
        .form-panel h2 { margin-bottom: 1.5rem; font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.6rem; background-color: var(--bg-primary); border: 1px solid var(--border); border-radius: 0.375rem; color: #fff; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
        .submit-btn { width: 100%; padding: 0.75rem; background: linear-gradient(to right, var(--accent), var(--accent-purple)); border: none; color: #fff; font-weight: 600; border-radius: 0.375rem; cursor: pointer; transition: opacity 0.2s; }
        .submit-btn:hover { opacity: 0.9; }

        /* Live Project Display Grid */
        .projects-panel h2 { font-size: 1.5rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .clear-btn { background: none; border: 1px solid #ef4444; color: #ef4444; padding: 0.25rem 0.5rem; font-size: 0.8rem; border-radius: 0.25rem; cursor: pointer; }
        .clear-btn:hover { background-color: #ef4444; color: #fff; }
        
        .projects-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 900px) { .projects-grid { grid-template-columns: 1fr 1fr; } }
        
        .project-card { background-color: var(--bg-secondary); border: 1px solid var(--border); padding: 1.5rem; border-radius: 0.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        .project-card h3 { color: #fff; margin-bottom: 0.5rem; }
        .project-card p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; flex-grow: 1; }
        
        .tech-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
        .tag { background-color: rgba(56, 189, 248, 0.1); color: var(--accent); font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px; }
        
        .card-links a { color: var(--accent-purple); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .card-links a:hover { text-decoration: underline; }
        
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem; border: 2px dashed var(--border); border-radius: 0.5rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Single-File <span>Full-Stack</span> Architecture</h1>
            <p>Frontend UI + API Router Controller + Local NoSQL Engine living inside one sandbox.</p>
        </header>

        <div class="dashboard-grid">
            <div class="form-panel">
                <h2>Database Entry Engine</h2>
                <form id="projectForm">
                    <div class="form-group">
                        <label for="title">Project Name</label>
                        <input type="text" id="title" required placeholder="e.g., E-Commerce App">
                    </div>
                    <div class="form-group">
                        <label for="description">Project Description</label>
                        <textarea id="description" rows="3" required placeholder="Describe what this project does..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="tech">Technologies (comma separated)</label>
                        <input type="text" id="tech" required placeholder="e.g., React, Node, MongoDB">
                    </div>
                    <div class="form-group">
                        <label for="link">Repository Link</label>
                        <input type="url" id="link" required placeholder="https://github.com/...">
                    </div>
                    <button type="submit" class="submit-btn">Execute Database POST Request</button>
                </form>
            </div>

            <div class="projects-panel">
                <h2>
                    Live Rendered Portfolio
                    <button class="clear-btn" id="clearDbBtn">Wipe Database</button>
                </h2>
                <div class="projects-grid" id="projectsContainer">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================================
        // DATABASE LAYER (Browser LocalStorage Engine)
        // ==========================================================================
        const DB_KEY = "portfolio_database_projects";

        // Initialize database seed records if completely empty
        function initializeDatabase() {
            if (!localStorage.getItem(DB_KEY)) {
                const initialSeed = [
                    {
                        id: 1,
                        title: "Demo System Core",
                        description: "This is a pre-seeded project loaded straight from your browser's persistent LocalStorage database cluster.",
                        tech: ["HTML5", "CSS3", "VanillaJS"],
                        link: "https://github.com"
                    }
                ];
                localStorage.setItem(DB_KEY, JSON.stringify(initialSeed));
            }
        }

        // ==========================================================================
        // BACKEND CONTROLLER ROUTER LAYER (Simulated REST API Logic)
        // ==========================================================================
        
        // Mock Route: GET /api/projects
        function getProjectsFromDb() {
            const rawData = localStorage.getItem(DB_KEY);
            return JSON.parse(rawData) || [];
        }

        // Mock Route: POST /api/projects/create
        function saveProjectToDb(newProject) {
            const currentDatabaseData = getProjectsFromDb();
            currentDatabaseData.push(newProject);
            localStorage.setItem(DB_KEY, JSON.stringify(currentDatabaseData));
            return { status: 201, message: "Resource created successfully inside LocalStorage." };
        }

        // Mock Route: DELETE /api/projects/purge
        function clearEntireDatabase() {
            localStorage.setItem(DB_KEY, JSON.stringify([]));
        }

        // ==========================================================================
        // FRONTEND APPLICATION CONTROLLER LAYER (JavaScript DOM Driver)
        // ==========================================================================
        const form = document.getElementById("projectForm");
        const container = document.getElementById("projectsContainer");
        const clearBtn = document.getElementById("clearDbBtn");

        // Function to read from data tier and write layout elements to screen
        function renderPortfolioView() {
            const projects = getProjectsFromDb();
            container.innerHTML = ""; // Clear existing elements

            if (projects.length === 0) {
                container.innerHTML = `<div class="empty-state">No records found inside database storage. Use the control form to write new structural items!</div>`;
                return;
            }

            projects.forEach(project => {
                // Parse tag arrays securely
                const tagsHTML = project.tech.map(t => `<span class="tag">${t.trim()}</span>`).join('');
                
                const card = document.createElement("div");
                card.className = "project-card";
                card.innerHTML = `
                    <div>
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                        <div class="tech-tags">${tagsHTML}</div>
                    </div>
                    <div class="card-links">
                        <a href="${project.link}" target="_blank">View Codebase &rarr;</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Event listener capturing form submit actions (Simulates Client sending POST requests to API)
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            // Extract values out of the form fields
            const title = document.getElementById("title").value;
            const description = document.getElementById("description").value;
            const techArray = document.getElementById("tech").value.split(",");
            const link = document.getElementById("link").value;

            // Shape the object payload
            const newProjectPayload = {
                id: Date.now(), // Unique ID token
                title: title,
                description: description,
                tech: techArray,
                link: link
            };

            // Pass payload to backend database simulation controller
            const response = saveProjectToDb(newProjectPayload);
            console.log("Server Log Response:", response.message);

            // Reset form view fields and refresh interface dynamically
            form.reset();
            renderPortfolioView();
        });

        // Event listener for wiping database cleaner
        clearBtn.addEventListener("click", function() {
            if (confirm("Are you sure you want to clear your local database collection?")) {
                clearEntireDatabase();
                renderPortfolioView();
            }
        });

        // App Boot Trigger Run
        initializeDatabase();
        renderPortfolioView();
    </script>
</body>
</html>
